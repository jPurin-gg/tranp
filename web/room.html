<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#14532d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/static/style.css">
<title>tranp</title>
</head>
<body class="room">

<section id="view-message" class="center" hidden>
  <h1 id="message"></h1>
  <a href="/" class="button secondary">部屋を作る</a>
</section>

<section id="view-wait" class="center" hidden>
  <h1>相手を待っています</h1>
  <p id="room-url" class="url"></p>
  <div class="row">
    <button id="copy" class="secondary">コピー</button>
    <button id="share" class="primary" hidden>送る</button>
  </div>
</section>

<section id="view-game" hidden>
  <header class="bar">
    <div class="corner">
      <div id="p-me" class="player"><span class="label">あなた</span><b id="s-me">0</b></div>
      <div id="map" class="map"><span></span><span></span><span></span><span></span></div>
    </div>
    <button id="up" class="nav" data-dx="0" data-dy="-1" aria-label="上の区画" hidden>▲</button>
    <div class="corner right">
      <div id="p-op" class="player"><span class="label">相手</span><b id="s-op">0</b></div>
    </div>
  </header>
  <div class="stage">
    <button id="left" class="nav" data-dx="-1" data-dy="0" aria-label="左の区画" hidden>◀</button>
    <div id="board" class="board"></div>
    <button id="right" class="nav" data-dx="1" data-dy="0" aria-label="右の区画" hidden>▶</button>
    <button id="down" class="nav" data-dx="0" data-dy="1" aria-label="下の区画" hidden>▼</button>
  </div>
</section>

<section id="view-result" class="overlay" hidden>
  <div class="card-panel">
    <h1 id="result"></h1>
    <p id="result-score" class="score"></p>
    <button id="rematch" class="primary">もう一回</button>
  </div>
</section>

<div id="rotate" class="rotate" aria-hidden="true">⟳</div>

<script type="module" src="/static/app.js"></script>
</body>
</html>
